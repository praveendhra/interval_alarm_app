name: interval_alarm
description: An interval-based alarm app with reminders and customizable tunes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  uuid: ^4.2.1
  intl: ^0.20.2
  flutter_local_notifications: ^19.5.0
  android_alarm_manager_plus: ^5.0.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  flutter_timezone: ^3.0.0
  google_fonts: ^8.0.0
  flutter_colorpicker: ^1.0.3
  permission_handler: ^12.0.1
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tunes/
