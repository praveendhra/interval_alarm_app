name: iOS release

# Signs the app with an App Store Connect API key and uploads it to TestFlight.
# No Mac needed. Run it from Actions → iOS release → Run workflow, or push a
# tag like ios-v1.0.0. Setup steps are in store/RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (leave empty to use pubspec.yaml)"
        required: false
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  BUNDLE_ID: com.pravii.intervalAlarm
  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
  APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
  CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see store/RELEASE.md)"; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Codemagic CLI tools
        run: pip3 install --break-system-packages codemagic-cli-tools || pip3 install codemagic-cli-tools

      - name: Check API key and bundle ID
        run: |
          # Errors are echoed as ::error:: annotations so they show on the run page.
          set +e
          OUT=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json 2>err.txt)
          if [ $? -ne 0 ]; then
            echo "::error::App Store Connect API call failed. Check the APP_STORE_CONNECT_* secrets. $(tail -c 600 err.txt | tr '\n' ' ')"
            exit 1
          fi
          if echo "$OUT" | grep -q "\"$BUNDLE_ID\""; then
            echo "Bundle ID $BUNDLE_ID is registered"
          else
            app-store-connect bundle-ids create "$BUNDLE_ID" --name "Cadence" --platform IOS 2>err.txt \
              || { echo "::error::Could not register $BUNDLE_ID: $(tail -c 600 err.txt | tr '\n' ' ')"; exit 1; }
          fi

      - name: Fetch or create signing certificate and profile
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create > sign.log 2>&1 \
            || { cat sign.log; echo "::error::Signing failed: $(tail -c 700 sign.log | tr '\n' ' ')"; exit 1; }
          keychain add-certificates

      - run: flutter pub get
      - name: Apply profiles to the Xcode project
        run: xcode-project use-profiles

      - name: Build IPA
        id: build
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Tags look like ios-v1.0.0 or ios-v1.0.0-<anything>; the part after
          # the first dash is ignored so a version can be rebuilt with a new tag.
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF_NAME" == ios-v* ]]; then VERSION="${GITHUB_REF_NAME#ios-v}"; VERSION="${VERSION%%-*}"; fi
          if [ -z "$VERSION" ]; then VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//'); fi
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          flutter build ipa --release --build-name="$VERSION" --build-number="$BUILD" \
            --export-options-plist="$HOME/export_options.plist" > build.log 2>&1 \
            || { tail -150 build.log; echo "::error::Build failed: $(grep -iE 'error' build.log | tail -5 | tr '\n' ' ' | tail -c 700)"; exit 1; }
          tail -20 build.log

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        run: |
          app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)" > publish.log 2>&1 \
            || { cat publish.log; echo "::error::Upload failed: $(tail -c 700 publish.log | tr '\n' ' ')"; exit 1; }
          cat publish.log

      - name: Summary
        run: |
          echo "### Uploaded Cadence ${{ steps.build.outputs.version }} (build ${{ steps.build.outputs.build }})" >> "$GITHUB_STEP_SUMMARY"
          echo "It shows up in App Store Connect → TestFlight after Apple processes it (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: keychain use-login || true
