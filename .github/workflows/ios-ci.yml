name: iOS check

# Builds the iOS app on every PR and push to master, runs it in the iPhone
# simulator with sample alarms, and captures 6.9" App Store screenshots.
# The screenshots and a run log are pushed to the `ci-screenshots` branch
# (and kept as a workflow artifact).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.pravii.intervalAlarm
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Release build compiles (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Boot iPhone simulator
        run: |
          mkdir -p shots
          xcrun simctl list devices available > shots/simulators.txt 2>&1 || true
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          phones=[x for rt,xs in sorted(d.items(), reverse=True) if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          pick=next((x for x in phones if "Pro Max" in x["name"]), None) or next((x for x in phones if "Plus" in x["name"]), None) or (phones[0] if phones else None)
          print(pick["udid"] if pick else "")
          ')
          if [ -z "$DEVICE" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"] if r else "")')
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; t=[x for x in json.load(sys.stdin)["devicetypes"] if "Pro Max" in x["name"]]; print(t[-1]["identifier"] if t else "")')
            echo "Creating simulator $TYPE on $RUNTIME" | tee -a shots/simulators.txt
            DEVICE=$(xcrun simctl create "Screenshots" "$TYPE" "$RUNTIME")
          fi
          echo "Using simulator $DEVICE" | tee -a shots/simulators.txt
          echo "SIM=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" 2>&1 | tee -a shots/simulators.txt || true
          xcrun simctl bootstatus "$DEVICE" -b 2>&1 | tail -3 | tee -a shots/simulators.txt
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 --dataNetwork wifi || true
          xcrun simctl ui "$DEVICE" appearance dark || true

      - name: Run demo builds and capture screenshots
        run: |
          mkdir -p shots
          n=1
          for screen in home detail create tunes; do
            flutter build ios --simulator --debug --dart-define=DEMO=true --dart-define=SCREEN=$screen
            xcrun simctl terminate "$SIM" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl install "$SIM" build/ios/iphonesimulator/Runner.app
            xcrun simctl launch "$SIM" "$BUNDLE_ID"
            sleep 25
            xcrun simctl io "$SIM" screenshot "shots/0${n}_${screen}.png"
            n=$((n+1))
          done

      - name: Check iOS scheduling and tune conversion
        run: |
          DATA=$(xcrun simctl get_app_container "$SIM" "$BUNDLE_ID" data)
          {
            echo "== Library/Sounds =="
            ls -la "$DATA/Library/Sounds" || echo "(missing)"
            for f in "$DATA"/Library/Sounds/*.caf; do [ -f "$f" ] && afinfo "$f" | grep -E "File type|Data format|estimated duration"; done
            echo "== App log =="
            xcrun simctl spawn "$SIM" defaults read "$BUNDLE_ID" flutter.debug_logs_v1 2>/dev/null \
              | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)))' \
              | grep -E "IOS|SETUP|ERROR|failed" || echo "(no log)"
          } | tee shots/run-log.txt
          # Sounds are converted while notifications are scheduled, so their
          # presence proves the iOS scheduler and the native converter both ran.
          ls "$DATA"/Library/Sounds/*.caf >/dev/null 2>&1 || { echo "::error::No notification sounds were converted"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Publish screenshots to ci-screenshots branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Run ${{ github.run_id }} on ${{ github.sha }}" > README.md
          git add -A && git commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
